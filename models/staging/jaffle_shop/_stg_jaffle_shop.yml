models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from the Jaffle Shop app, with one row per customer.
    columns:
      - name: customer_id
        description: The primary key for customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: The customer's first name.
      - name: last_name
        description: The customer's last name.

  - name: stg_jaffle_shop__orders
    description: Staged order data from the Jaffle Shop app, with one row per order.
    columns:
      - name: order_id
        description: The primary key for orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to `stg_jaffle_shop__customers.customer_id`.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: The date the order was placed.
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
